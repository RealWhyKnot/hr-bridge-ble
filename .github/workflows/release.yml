name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2026.8.19.0 or v2026.8.19.0-beta'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ github.event.inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff build pyinstaller
          python -m pip install -e .

      - name: Stamp the version
        id: stamp
        shell: pwsh
        run: |
          $version = '${{ steps.release_tag.outputs.tag }}' -replace '^v', ''
          $pep = $version -replace '-beta$', 'b0'
          $pep = $pep -replace '-([A-Fa-f0-9]{4})$', '+$1'
          $init = 'src/hr_bridge_ble/__init__.py'
          [System.IO.File]::WriteAllText($init, "__version__ = `"$pep`"`n", [System.Text.UTF8Encoding]::new($false))
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m unittest discover

      - name: Build the Windows executable
        run: pyinstaller --onefile --clean --noconfirm --name hr-bridge-ble --paths src --distpath dist/exe packaging/entry.py

      - name: Build the source and wheel distributions
        run: python -m build --outdir dist/python

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.stamp.outputs.version }}'
          $stage = "dist/stage/hr-bridge-ble-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist/exe/hr-bridge-ble.exe $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item -Recurse packaging (Join-Path $stage 'autostart')
          Remove-Item (Join-Path $stage 'autostart/entry.py')
          $zip = "dist/hr-bridge-ble-$version.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          $lines = @("$hash`t$((Get-Item $zip).Length)`t$(Split-Path $zip -Leaf)")
          foreach ($file in Get-ChildItem dist/python) {
            $lines += "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash)`t$($file.Length)`t$($file.Name)"
          }
          $integrity = "dist/hr-bridge-ble-$version.integrity.tsv"
          [System.IO.File]::WriteAllLines($integrity, [string[]]$lines, [System.Text.UTF8Encoding]::new($false))
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path $zip -Leaf)" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "integrity=$integrity" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          title: hr-bridge-ble ${{ steps.release_tag.outputs.tag }}
          extra: |
            ## Downloads

            - `${{ steps.package.outputs.name }}` holds the Windows executable and the autostart templates. No Python needed.
            - The `.whl` and `.tar.gz` are for macOS and Linux: `pipx install <url of the wheel>`.
            - SHA256 of the zip: `${{ steps.package.outputs.sha256 }}`
            - Hashes for every file are in the attached `.integrity.tsv`.

      - name: Create GitHub release
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ steps.release_tag.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          assets: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.integrity }}
            dist/python/*
